spring:
  application:
    name: ms-pims-inventory-service

  config:
    import:
      - "optional:consul:"

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

erpnext:
  wrapper:
    url: ${ERPNEXT_WRAPPER_URL:}
    tenant-id: ${ERPNEXT_WRAPPER_TENANT_ID:}

# Canonical REST contract: classpath static/openapi/inventory-api-v1.yaml (also linked in Swagger UI).
# Generated /v3/api-docs is for convenience; external publishers should prefer the versioned YAML.
springdoc:
  api-docs:
    path: /api/v1/inventory/v3/api-docs
  swagger-ui:
    path: /api/v1/inventory/swagger-ui.html
    operationsSorter: method
    tags-sorter: alpha
    urls:
      - name: Inventory API contract (YAML)
        url: /openapi/inventory-api-v1.yaml
      - name: Live service (generated)
        url: /api/v1/inventory/v3/api-docs
