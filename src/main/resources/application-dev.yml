spring:
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: ms-pims-inventory-service-dev
    listener:
      auto-startup: false

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.reactive.ReactiveSecurityAutoConfiguration
      - org.springframework.boot.autoconfigure.security.reactive.ReactiveUserDetailsServiceAutoConfiguration
      - org.springframework.boot.actuate.autoconfigure.security.reactive.ReactiveManagementWebSecurityAutoConfiguration
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: https://iam-dhealth.sha.go.ke/realms/pims/protocol/openid-connect/certs
  cloud:
    consul:
      enabled: false
      discovery:
        enabled: false
        register: false
      config:
        enabled: false

server:
  port: 8086

erpnext:
  wrapper:
    url: http://185.218.124.26:8082
    tenant-id: abc-pharmacy-westlands

kafka:
  topic:
    payment-success: payment-success

# Canonical REST contract: classpath static/openapi/inventory-api-v1.yaml (also linked in Swagger UI).
# Generated /v3/api-docs is for convenience; external publishers should prefer the versioned YAML.
springdoc:
  api-docs:
    path: /api/v1/inventory/v3/api-docs
  swagger-ui:
    path: /api/v1/inventory/swagger-ui.html
    operationsSorter: method
    tags-sorter: alpha
    urls:
      - name: Inventory API contract (YAML)
        url: /openapi/inventory-api-v1.yaml
      - name: Live service (generated)
        url: /api/v1/inventory/v3/api-docs
